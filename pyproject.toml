[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ome-zarr-writer"
version = "0.3.2"
description = "Write valid OME-Zarr 0.5 multiscale images"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Junel Solis, Turku BioImaging", email = "junel.solis@abo.fi"},
    {name = "Linda Srbova, Turku BioImaging", email = "linda.srbova@abo.fi"}
]
maintainers = [
    {name = "Junel Solis, Turku BioImaging", email = "junel.solis@abo.fi"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["ome", "zarr", "image", "microscopy", "bioimage"]
requires-python = ">=3.11"
dependencies = [
    "dask",
    "dask-image",
    "jsonschema>=4.0.0",
    "numpy>=1.20.0",
    "scikit-image",
    "zarr>=3,<4"
]

[project.optional-dependencies]
gpu = [
    "cupy-cuda12x",  # Replace '12x' with your specific CUDA version, e.g., 'cupy-cuda120'
]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "flake8",
    "mypy",
    "pre-commit",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-autodoc-typehints",
]

[project.urls]
Homepage = "https://github.com/Turku-BioImaging/ome-zarr-writer"
Repository = "https://github.com/Turku-BioImaging/ome-zarr-writer"
Documentation = "https://github.com/Turku-BioImaging/ome-zarr-writer#readme"
"Bug Tracker" = "https://github.com/Turku-BioImaging/ome-zarr-writer/issues"

[tool.setuptools]
packages = ["ome_zarr_writer"]

[tool.setuptools.package-dir]
ome_zarr_writer = "src/ome_zarr_writer"

[tool.black]
line-length = 88
target-version = ['py311', 'py312', 'py313']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--strict-markers",
    "--strict-config", 
    "--verbose",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:jsonschema.*",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
